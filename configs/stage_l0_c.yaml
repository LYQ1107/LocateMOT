stage: L0-C
seed: 20260806
data:
  youtube_vos_root: /data3/testdata/vranlee/.MOTSynth.partial/YouTube-VOS-2019/train
  mose_root: /data3/testdata/vranlee/.MOTSynth.partial/MOSEv2/train
  frozen_splits:
    train: /data3/testdata/vranlee/.MOTSynth.partial/GLEE_PMOT_stage1/stage_u_unified_tracker/unified_train_split.json
    calibration: /data3/testdata/vranlee/.MOTSynth.partial/GLEE_PMOT_stage1/stage_u_unified_tracker/unified_calibration_split.json
    heldout: /data3/testdata/vranlee/.MOTSynth.partial/GLEE_PMOT_stage1/stage_d_full/identity_heldout_split.json
  split_sizes:
    train: {youtube: 200, mose: 200}
    calibration: {youtube: 40, mose: 40}
    heldout: {youtube: 75, mose: 75}
  frames_per_video: 4
cache:
  root: /data3/testdata/vranlee/.MOTSynth.partial/LocateMOT_L0C/cache
  protocols: [category_guided, generic]
  generic_query: "Locate all instances of objects."
  main_feature: pbd_coord_mean_last
